name: Security Clearance & Data Leakage Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clearance-audit:
    name: Verify Zero-Leakage Clearance Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Zero-Trust Clearance Tests
        run: npm run test

      - name: Verify TypeScript & Build Integrity
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
